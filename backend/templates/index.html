<!DOCTYPE html>
<html>
<head>
    <title>Holocron</title>
    <style>
        body {
            background: #0b0f14;
            color: #e8eef5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #8995a3;
            margin-bottom: 25px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .control {
            background: #151b23;
            padding: 15px;
            border-radius: 10px;
        }

        label {
            display: block;
            color: #9ca9b8;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #0d1218;
            border: 1px solid #303a46;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin-right: 8px;
            font-size: 15px;
        }

        #start {
            background: #54d68c;
            color: #07110b;
        }

        #pause {
            background: #e6b84c;
            color: #171107;
        }

        #reset {
            background: #303a46;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat {
            background: #151b23;
            padding: 18px;
            border-radius: 10px;
        }

        .stat-title {
            color: #8995a3;
            font-size: 13px;
        }

        .stat-value {
            font-size: 28px;
            margin-top: 5px;
        }

        canvas {
            width: 100%;
            height: 350px;
            background: #080c11;
            border: 1px solid #27313c;
            border-radius: 10px;
        }

        .status {
            margin-top: 12px;
            color: #54d68c;
        }

        @media(max-width: 800px) {
            .controls,
            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<h1>HOLOCRON</h1>
<div class="subtitle">
    Continuous movement simulation
</div>

<div class="controls">

    <div class="control">
        <label>Chorea level (0–10)</label>
        <input id="chorea" type="number" min="0" max="10" value="6">
    </div>

    <div class="control">
        <label>Sleep (hours)</label>
        <input id="sleep" type="number" min="0" max="24" value="7">
    </div>

    <div class="control">
        <label>Meals</label>
        <input id="meals" type="number" min="0" max="10" value="3">
    </div>

    <div class="control">
    <label>Reported stress</label>

    <select id="stress">
        <option value="2">Very low</option>
        <option value="4">Low</option>
        <option value="6" selected>Moderate</option>
        <option value="8">High</option>
        <option value="10">Very high</option>
    </select>

    <small>Self-reported demo value, not a clinical score</small>
</div>

</div>

<button id="start">START</button>
<button id="pause">PAUSE</button>
<button id="reset">RESET</button>

<div class="stats">
    <div class="stat">
        <div class="stat-title">Current movement</div>
        <div class="stat-value" id="movement">0.00</div>
    </div>

    <div class="stat">
        <div class="stat-title">Simulation stimulation</div>
        <div class="stat-value" id="stim">0%</div>
    </div>

    <div class="stat">
        <div class="stat-title">Time</div>
        <div class="stat-value" id="time">0.0s</div>
    </div>
</div>

<canvas id="graph"></canvas>

<div class="status" id="status">
    Ready
</div>

<script>

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

const movementText = document.getElementById("movement");
const stimText = document.getElementById("stim");
const timeText = document.getElementById("time");
const statusText = document.getElementById("status");

let running = false;
let animationFrame = null;

let startTime = 0;
let elapsed = 0;

let signal = [];
let stimulation = [];

const MAX_POINTS = 500;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;

    ctx.scale(
        window.devicePixelRatio,
        window.devicePixelRatio
    );
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


function getInputs() {

    return {
        chorea: Number(document.getElementById("chorea").value),
        sleep: Number(document.getElementById("sleep").value),
        meals: Number(document.getElementById("meals").value),
        stress: Number(document.getElementById("stress").value)
    };

}


function calculateMovement() {

    const input = getInputs();

    let movement = input.chorea;

    if (input.sleep < 8) {
        movement += (8 - input.sleep) * 0.06;
    }

    if (input.meals < 3) {
        movement += (3 - input.meals) * 0.05;
    }

    movement += input.stress * 0.03;

    return Math.max(0, Math.min(10, movement));

}


function getStimulation(t) {

    /*
       0–10 seconds:
       baseline

       10–20 seconds:
       simulated stimulation

       20+ seconds:
       simulated after-effect
    */

    if (t < 10) {
        return 0;
    }

    if (t < 12) {
        return ((t - 10) / 2) * 80;
    }

    if (t < 20) {
        return 80;
    }

    if (t < 25) {
        return 80 * (1 - (t - 20) / 5);
    }

    return 0;
}


function generateMovement(t) {

    const base = calculateMovement();

    const stim = getStimulation(t);

    /*
       This is deliberately a simulation.
       Stimulation reduces the simulated movement signal.
    */

    let reduction = (stim / 80) * 0.35;

    let value = base * (1 - reduction);

    /*
       Multiple sine waves create continuously changing
       irregular movement instead of a flat line.
    */

    value += Math.sin(t * 5.2) * base * 0.12;
    value += Math.sin(t * 8.7) * base * 0.07;
    value += Math.sin(t * 13.1) * base * 0.04;

    /*
       Small pseudo-random component
    */

    value += (Math.random() - 0.5) * base * 0.15;

    return Math.max(0, Math.min(10, value));
}


function draw() {

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    ctx.clearRect(0, 0, width, height);

    /*
       Grid
    */

    ctx.strokeStyle = "#202832";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 10; i++) {

        const y = height - (i / 10) * height;

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }

    /*
       Movement signal
    */

    ctx.beginPath();

    signal.forEach((point, index) => {

        const x =
            (index / (MAX_POINTS - 1)) * width;

        const y =
            height - (point / 10) * height;

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

    });

    ctx.strokeStyle = "#54d68c";
    ctx.lineWidth = 2;
    ctx.stroke();


    /*
       Stimulation indicator
    */

    ctx.beginPath();

    stimulation.forEach((point, index) => {

        const x =
            (index / (MAX_POINTS - 1)) * width;

        const y =
            height - (point / 100) * height;

        if (index === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }

    });

    ctx.strokeStyle = "#e6b84c";
    ctx.lineWidth = 1.5;
    ctx.stroke();


    /*
       Labels
    */

    ctx.fillStyle = "#697583";
    ctx.font = "12px Arial";

    ctx.fillText("10", 8, 15);
    ctx.fillText("5", 8, height / 2);
    ctx.fillText("0", 8, height - 8);
}


function update() {

    if (!running) {
        return;
    }

    elapsed = (performance.now() - startTime) / 1000;

    const stim = getStimulation(elapsed);
    const movement = generateMovement(elapsed);

    signal.push(movement);
    stimulation.push(stim);

    if (signal.length > MAX_POINTS) {
        signal.shift();
    }

    if (stimulation.length > MAX_POINTS) {
        stimulation.shift();
    }

    movementText.textContent = movement.toFixed(2);
    stimText.textContent = Math.round(stim) + "%";
    timeText.textContent = elapsed.toFixed(1) + "s";

    if (elapsed < 10) {
        statusText.textContent = "Baseline movement";
    }
    else if (elapsed < 20) {
        statusText.textContent = "Simulated stimulation active";
    }
    else if (elapsed < 25) {
        statusText.textContent = "Simulated after-effect";
    }
    else {
        statusText.textContent = "Continuous monitoring";
    }

    draw();

    animationFrame = requestAnimationFrame(update);
}


document.getElementById("start").addEventListener("click", () => {

    if (running) return;

    running = true;

    startTime = performance.now() - elapsed * 1000;

    statusText.textContent = "Running";

    update();
});


document.getElementById("pause").addEventListener("click", () => {

    running = false;

    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
    }

    statusText.textContent = "Paused";
});


document.getElementById("reset").addEventListener("click", () => {

    running = false;

    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
    }

    elapsed = 0;

    signal = [];
    stimulation = [];

    movementText.textContent = "0.00";
    stimText.textContent = "0%";
    timeText.textContent = "0.0s";

    statusText.textContent = "Ready";

    draw();
});


draw();

</script>

</body>
</html>
